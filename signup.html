<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | GameX</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; background-color: white;
        }

        /* The Background Image with 25% transparency */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            /* Adjusting opacity to make it 25% transparent */
            opacity: 0.75; 
        }
        .bg-container img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Layout Container */
        .signup-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            padding: 50px;
            box-sizing: border-box;
        }

        /* Heading Style */
        .header-box {
            background-color: #ff0000;
            color: black;
            font-size: 2.5rem;
            font-weight: 900;
            padding: 10px 30px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Black Rounded Inputs */
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            max-width: 400px;
            background-color: black;
            border: none;
            border-radius: 50px;
            padding: 15px;
            color: white;
            margin-bottom: 30px;
            display: block;
            margin-left: auto; margin-right: auto;
        }

        /* Checkbox area */
        .terms-area {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        input[type="checkbox"] {
            width: 25px; height: 25px; margin-right: 15px;
        }

        /* Neon Green Sign-Up Button */
        .btn-signup {
            background-color: #a2ff00; /* Neon Lime Green */
            color: black;
            font-weight: 900;
            font-size: 1.8rem;
            padding: 15px 40px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .column-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 100px;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- Using your banneresg.png file -->
        <img src="banneresg.png" alt="Background">
    </div>

    <div class="signup-wrapper">
        <!-- Left Side -->
        <div class="column-left">
            <div class="header-box">Sign-Up</div>
            
            <label>Email</label>
            <input type="email">

            <label>Username</label>
            <input type="text">

            <label>Password</label>
            <input type="password">
        </div>

        <!-- Right Side -->
        <div class="column-right">
            <label>Confirm Password</label>
            <input type="password">

            <div class="terms-area">
                <input type="checkbox" id="terms">
                <label for="terms" style="font-size: 1.1rem; margin:0;">I agree to the terms and conditions</label>
            </div>

            <button class="btn-signup">Sign -Up</button>
        </div>
    </div>

    <div class="footer-text">
        © 2026 Gamex Cloud Gaming Streaming service
    </div>

</body>
</html>
