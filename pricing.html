<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing | GameX Cloud</title>
    <link rel="icon" type="image/png" href="logo.png.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            display: flex; height: 100vh;
            background-color: white; overflow: hidden;
        }

        /* Left Side: Pricing Info */
        .pricing-side {
            width: 45%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px; box-sizing: border-box;
        }

        .header-box {
            background-color: #ff0000;
            color: black;
            font-size: 2.2rem;
            font-weight: 900;
            padding: 10px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* The Rephrased Content Box */
        .plan-card {
            background-color: black;
            color: white;
            padding: 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .plan-name { font-size: 1.5rem; color: #a2ff00; margin-bottom: 10px; }
        .price { font-size: 3.5rem; font-weight: 900; margin-bottom: 20px; }
        .price span { font-size: 1.2rem; color: #ccc; }

        .features-list {
            text-align: left;
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }

        .features-list li {
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .features-list li::before {
            content: "✓";
            color: #a2ff00;
            margin-right: 10px;
            font-weight: 900;
        }

        .btn-green {
            background-color: #a2ff00;
            color: black;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-green:hover { transform: scale(1.05); }

        /* Right Side: Image */
        .banner-side { width: 55%; background-color: #111; }
        .banner-side img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Back Link */
        .back-link { margin-top: 20px; color: #0000FF; font-weight: 700; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

    <div class="pricing-side">
        <div class="header-box">Pricing</div>

        <div class="plan-card">
            <div class="plan-name">PREMIUM ACCESS</div>
            <div class="price">$15<span>/mo</span></div>
            
            <ul class="features-list">
                <li>Unlimited Gaming Hours</li>
                <li>4K Ultra-HD Streaming</li>
                <li>Zero Latency Servers</li>
                <li>Priority Queue Access</li>
                <li>Exclusive Early Access</li>
            </ul>

            <button class="btn-green" onclick="window.location.href='signup.html'">START NOW</button>
        </div>

        <a href="index.html" class="back-link">Return to Home</a>
    </div>

    <div class="banner-side">
        <img src="bannergo (1).jpg" alt="Gaming Banner">
    </div>

</body>
</html>
