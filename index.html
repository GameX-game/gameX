<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameX | Pro Cloud Streaming</title>
    <style>
        :root { --primary-red: #ff0000; --bg-black: #050505; --card-bg: #121212; }
        body { background: var(--bg-black); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        
        /* Navigation */
        nav { background: rgba(0,0,0,0.9); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .logo { height: 40px; } /* This is for your new logo */
        .status-pill { background: #1a1a1a; padding: 5px 15px; border-radius: 20px; font-size: 12px; border: 1px solid #444; }
        .hz-val { color: var(--primary-red); font-weight: bold; }

        /* Hero Section */
        .hero { padding: 60px 5%; text-align: left; background: linear-gradient(to right, #000, transparent), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=2070'); background-size: cover; }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; }

        /* Game Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding: 40px 5%; }
        .game-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: 0.3s; cursor: pointer; position: relative; }
        .game-card:hover { transform: translateY(-10px); border-color: var(--primary-red); box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        .game-img { width: 100%; height: 350px; object-fit: cover; }
        .game-info { padding: 15px; background: linear-gradient(transparent, #000); position: absolute; bottom: 0; width: 100%; }
        .launch-btn { background: var(--primary-red); color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }

        /* Player Overlay */
        #player { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; }
    </style>
</head>
<body>

<nav>
    <div class="logo">
        <span style="font-size: 24px; font-weight: bold; color: white;">Game<span style="color:red; font-style: italic;">X</span></span>
    </div>
    <div class="status-pill">System: <span id="hz-display" class="hz-val">Detecting...</span></div>
</nav>

<section class="hero">
    <h1>Welcome to GameX</h1>
    <p>120 FPS Cloud Gaming. Powered by Google Cloud.</p>
</section>

<div class="grid">
    <!-- Fortnite Card -->
    <div class="game-card" onclick="playGame()">
        <img src="https://assets.xboxservices.com/assets/f0/95/f0951662-7560-4497-8321-464a4b860000.jpg?n=Fortnite_GLP-Page-Hero-0_1080x1250.jpg" class="game-img">
        <div class="game-info">
            <h3>Fortnite</h3>
            <button class="launch-btn">PLAY NOW</button>
        </div>
    </div>

    <!-- Rocket League Card -->
    <div class="game-card" onclick="playGame()">
        <img src="https://m.media-amazon.com/images/M/MV5BNjYyOGY0NDEtZGRjYS00N2I5LWIwZGMtOWY3YjBiNzhkYWM4XkEyXkFqcGdeQXVyMTA0MTM5NjI2._V1_.jpg" class="game-img">
        <div class="game-info">
            <h3>Rocket League</h3>
            <button class="launch-btn">PLAY NOW</button>
        </div>
    </div>

    <!-- Roblox Card -->
    <div class="game-card" onclick="playGame()">
        <img src="https://images.rbxcdn.com/f04c637a892b34f89d3fa122f46ee6c9.jpg" class="game-img">
        <div class="game-info">
            <h3>Roblox</h3>
            <button class="launch-btn">PLAY NOW</button>
        </div>
    </div>
</div>

<!-- Streaming Interface -->
<div id="player">
    <button onclick="closeGame()" style="position:absolute; top:20px; right:20px; color:white; background:red; border:none; padding:10px 20px; border-radius:5px; z-index:1100;">EXIT GAME</button>
    <iframe src="" id="stream-frame" style="width:100%; height:100%; border:none;"></iframe>
</div>

<script>
    // Monitor Hz Detector
    function getHz() {
        let frames = 0;
        let start = performance.now();
        function check() {
            frames++;
            if (performance.now() - start >= 1000) {
                document.getElementById('hz-display').innerText = frames + "Hz";
                return;
            }
            requestAnimationFrame(check);
        }
        requestAnimationFrame(check);
    }
    getHz();

    // Stream Handlers
    function playGame() {
        document.getElementById('player').style.display = 'block';
        // When your Google Cloud is ready, you put the IP here:
        document.getElementById('stream-frame').src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
    }
    function closeGame() {
        document.getElementById('player').style.display = 'none';
        document.getElementById('stream-frame').src = "";
    }
</script>

</body>
</html>
