<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameX | Cloud Streaming</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* Navigation */
        nav { 
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(0,0,0,0.95); border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 8%; z-index: 1000; box-sizing: border-box;
        }
        .nav-links a { color: #bbb; text-decoration: none; margin-left: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: var(--red); }

        /* Sections */
        .page-section { display: none; min-height: 100vh; padding-top: 80px; width: 100%; }
        .active { display: flex !important; flex-direction: column; align-items: center; justify-content: center; }

        /* Home Image Style */
        #home-content { 
            background: url('Trusted by 1.5k+ Investors (7).jpg') no-repeat center center;
            background-size: cover;
            width: 100%;
            height: calc(100vh - 80px);
        }

        /* Pricing Style */
        #pricing-content { background: var(--dark); text-align: center; padding: 100px 5%; }
        .pricing-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 50px; }
        .price-card { 
            background: #111; padding: 40px; border-radius: 20px; border: 1px solid #333;
            width: 320px; transition: 0.4s;
        }
        .price-card.featured { border: 2px solid var(--red); box-shadow: 0 0 30px rgba(255,0,0,0.1); }
        
        .btn { 
            display: block; width: 100%; padding: 15px 0; margin-top: 20px;
            text-decoration: none; font-weight: bold; border-radius: 8px; text-transform: uppercase;
            color: white; border: none; cursor: pointer;
        }
        .btn-gray { background: #222; }
        .btn-red { background: var(--red); }

        footer { position: fixed; bottom: 0; width: 100%; padding: 20px; background: rgba(0,0,0,0.8); text-align: center; color: #444; font-size: 12px; }
    </style>
</head>
<body>

<nav>
    <img src="Caignite (6).png" alt="GameX" style="height: 50px;">
    <div class="nav-links">
        <a onclick="showTab('home')">HOME</a>
        <a onclick="showTab('pricing')">PRICING</a>
    </div>
</nav>

<!-- Home Tab -->
<div id="home" class="page-section active">
    <div id="home-content"></div>
</div>

<!-- Pricing Tab -->
<div id="pricing" class="page-section">
    <div id="pricing-content">
        <h2 style="font-size: 3rem; margin: 0;">Choose Your Power</h2>
        <div class="pricing-grid">
            <div class="price-card">
                <h2 style="color: #666;">FREE</h2>
                <div style="font-size: 3.5rem; font-weight: 800; margin: 20px 0;">$0<span>/mo</span></div>
                <p>1 Hour Sessions • 1080p 60fps</p>
                <button class="btn btn-gray" onclick="showTab('home')">START PLAYING</button>
            </div>
            <div class="price-card featured">
                <h2 style="color: var(--red);">ELITE</h2>
                <div style="font-size: 3.5rem; font-weight: 800; margin: 20px 0;">$15<span>/mo</span></div>
                <p>Unlimited • 4K 120fps • No Ads</p>
                <button class="btn btn-red">GO PRO</button>
            </div>
        </div>
    </div>
</div>

<footer>&copy; 2026 GameX Cloud Gaming.</footer>

<script>
    function showTab(tabId) {
        // Hide all sections
        document.getElementById('home').classList.remove('active');
        document.getElementById('pricing').classList.remove('active');
        
        // Show the clicked section
        document.getElementById(tabId).classList.add('active');
    }
</script>

</body>
</html>
