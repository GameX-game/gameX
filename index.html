<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameX | Cloud Streaming</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        
        /* FIX 1: Smooth Scrolling must be on the HTML tag */
        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: 80px; 
        }

        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding: 0; }

        /* Navigation Fix */
        nav { 
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(0,0,0,0.9); border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; box-sizing: border-box;
        }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; cursor: pointer; }

        /* Hero Section with proper ID */
        #home { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070');
            background-size: cover; background-position: center;
        }

        /* Pricing Section with proper ID */
        #pricing { 
            padding: 100px 5%; background: #0a0a0a; min-height: 100vh;
        }

        .pricing-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 50px; }
        
        .price-card { 
            background: #111; padding: 40px; border-radius: 20px; border: 1px solid #333;
            width: 300px; text-align: center; transition: 0.3s;
        }
        .price-card.featured { border: 2px solid var(--red); }
        .price-card:hover { transform: translateY(-10px); border-color: var(--red); }

        /* FIX 2: Style <a> tags to look like the buttons in your video */
        .btn { 
            display: block; width: 100%; padding: 15px 0; margin-top: 20px;
            text-decoration: none; font-weight: bold; border-radius: 8px; text-transform: uppercase;
        }
        .btn-gray { background: #333; color: white; }
        .btn-red { background: var(--red); color: white; }

        footer { padding: 50px; border-top: 1px solid #222; text-align: center; color: #444; }
    </style>
</head>
<body>

<nav>
    <img src="Caignite (6).png" alt="Logo" style="height: 50px;">
    <div class="nav-links">
        <a href="#home">HOME</a>
        <a href="#pricing">PRICING</a>
    </div>
</nav>

<!-- Section 1 -->
<section id="home">
    <h1 style="font-size: 4rem; margin: 0;">GAMING WITHOUT LIMITS</h1>
    <p style="font-size: 1.5rem; color: #aaa;">120 FPS Cloud Gaming starts here.</p>
</section>

<!-- Section 2 -->
<section id="pricing">
    <h2 style="font-size: 3rem; text-align: center;">Choose Your Power</h2>
    <div class="pricing-grid">
        
        <!-- Free Card -->
        <div class="price-card">
            <h2 style="color: #666;">FREE</h2>
            <div style="font-size: 3rem; margin: 20px 0;">$0<span style="font-size: 1rem;">/mo</span></div>
            <p>1 Hour Sessions</p>
            <!-- FIX 3: Pointing back to home for now -->
            <a href="#home" class="btn btn-gray">START PLAYING</a>
        </div>

        <!-- Elite Card -->
        <div class="price-card featured">
            <h2 style="color: var(--red);">ELITE</h2>
            <div style="font-size: 3rem; margin: 20px 0;">$15<span style="font-size: 1rem;">/mo</span></div>
            <p>Unlimited 4K Sessions</p>
            <!-- Pointing to a dummy link for now -->
            <a href="#home" class="btn btn-red">GO PRO</a>
        </div>

    </div>
</section>

<footer>
    &copy; 2026 GameX Cloud Gaming. All Rights Reserved.
</footer>

</body>
</html>
