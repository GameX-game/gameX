<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameX | Cloud Streaming</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; --card-bg: #111; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

        nav { 
            position: fixed; top: 0; width: 100%; height: 80px;
            background: rgba(0,0,0,0.95); border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 8%; z-index: 1000; box-sizing: border-box;
        }
        .nav-links a { color: #bbb; text-decoration: none; margin-left: 25px; font-weight: bold; cursor: pointer; }
        .nav-links a:hover { color: var(--red); }

        .page-section { display: none; padding-top: 80px; }
        .active { display: block !important; }

        /* Hero Image - Fixed with URL Encoding */
        .hero-container {
            width: 100%;
            background: black;
            text-align: center;
        }
        .hero-img {
            width: 100%;
            max-width: 1200px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .container { padding: 40px 10%; text-align: center; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin-top: 40px; }
        .game-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #222; }
        .game-card img { width: 100%; height: 200px; object-fit: cover; background: #222; }

        .about-section { background: #0a0a0a; border-radius: 20px; padding: 40px; margin-top: 50px; border: 1px solid #1a1a1a; text-align: left; }
        .about-section h2 { color: var(--red); }

        .pricing-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 50px; }
        .price-card { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #333; width: 320px; text-align: center; }
        .price-card.featured { border: 2px solid var(--red); }
        
        .btn { display: block; width: 100%; padding: 15px 0; margin-top: 20px; text-decoration: none; font-weight: bold; border-radius: 8px; color: white; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-red { background: var(--red); }

        footer { padding: 40px; text-align: center; color: #444; font-size: 14px; }
    </style>
</head>
<body>

<nav>
    <img src="Caignite%20(6).png" alt="GameX" style="height: 50px;">
    <div class="nav-links">
        <a onclick="showTab('home')">HOME</a>
        <a onclick="showTab('pricing')">PRICING</a>
    </div>
</nav>

<div id="home" class="page-section active">
    <div class="hero-container">
        <!-- THE FIXED IMAGE LINK -->
        <img src="Trusted%20by%201.5k%2B%20Investors%20(7).jpg" class="hero-img" alt="Hero">
    </div>

    <div class="container">
        <h2>Available Games</h2>
        <div class="game-grid">
            <div class="game-card">
                <img src="https://wallpapers.com/images/featured/fortnite-pictures-b538asv6n569v37a.jpg" alt="Fortnite">
                <h3>Fortnite</h3>
                <button class="btn btn-red">LAUNCH</button>
            </div>
            <div class="game-card">
                <img src="https://images.rbxcdn.com/f04c637a892b34f89d3fa122f46ee6c9.jpg" alt="Roblox">
                <h3>Roblox</h3>
                <button class="btn btn-red">LAUNCH</button>
            </div>
        </div>

        <div class="about-section">
            <h2>About GameX</h2>
            <p>Welcome to the 2026 gaming revolution. GameX streams high-end NVIDIA GPU power directly to your browser. No downloads, no lag, just play.</p>
        </div>
    </div>
</div>

<div id="pricing" class="page-section">
    <div class="container">
        <h2>Choose Your Power</h2>
        <div class="pricing-grid">
            <div class="price-card">
                <h2>FREE</h2>
                <div style="font-size: 3rem;">$0</div>
                <button class="btn btn-red" style="background:#333;" onclick="showTab('home')">START PLAYING</button>
            </div>
            <div class="price-card featured">
                <h2 style="color: var(--red);">ELITE</h2>
                <div style="font-size: 3rem;">$15</div>
                <button class="btn btn-red">GO PRO</button>
            </div>
        </div>
    </div>
</div>

<footer>&copy; 2026 GameX Cloud Gaming.</footer>

<script>
    function showTab(tabId) {
        document.getElementById('home').classList.remove('active');
        document.getElementById('pricing').classList.remove('active');
        document.getElementById(tabId).classList.add('active');
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
