<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GameX | Home</title>
    <style>
        :root { --red: #ff0000; --dark: #0a0a0a; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        nav { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-around; }
        .hero { padding: 100px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070'); background-size: cover; }
        
        /* Pricing Table */
        .pricing-section { padding: 50px 5%; }
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .price-card { background: #111; padding: 30px; border: 1px solid #333; border-radius: 15px; transition: 0.3s; }
        .price-card.featured { border-color: var(--red); transform: scale(1.05); }
        .price-card h2 { color: var(--red); }
        .price { font-size: 2rem; font-weight: bold; }

        footer { padding: 40px; border-top: 1px solid #222; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<nav>
    <img src="Caignite (6).png" alt="GameX Logo" style="height:40px;">
    <div>
        <a href="#home" style="color:white; margin:0 15px; text-decoration:none;">Home</a>
        <a href="#pricing" style="color:white; margin:0 15px; text-decoration:none;">Pricing</a>
    </div>
</nav>

<section id="home" class="hero">
    <h1>GAMING WITHOUT LIMITS</h1>
    <p>Stream your favorite titles at 120 FPS instantly.</p>
</section>

<section id="pricing" class="pricing-section">
    <h2>Choose Your Power</h2>
    <div class="pricing-grid">
        <div class="price-card">
            <h2>FREE</h2>
            <div class="price">$0<span>/mo</span></div>
            <p>1 Hour Sessions</p>
            <p>Standard Quality</p>
            <button style="background:#333; color:white; border:none; padding:10px 20px; cursor:pointer;">START PLAYING</button>
        </div>
        <div class="price-card featured">
            <h2>ELITE</h2>
            <div class="price">$15<span>/mo</span></div>
            <p>Unlimited Sessions</p>
            <p>4K / 120 FPS</p>
            <button style="background:var(--red); color:white; border:none; padding:10px 20px; cursor:pointer;">GO PRO</button>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2026 GameX Cloud Gaming. All Rights Reserved. Built for the future of play.</p>
</footer>

</body>
</html>
